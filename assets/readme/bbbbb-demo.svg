<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="demoTitle demoDesc">
  <title id="demoTitle">bbbbb delivery demo</title>
  <desc id="demoDesc">A wide animated scene shows either a web request or a wrapped command in a terminal. A delivery pulse travels to an iPhone, a generic notification appears, and a successful update arrives in the Activity inbox.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    .badge-a { animation: badgeA 16s linear infinite; }
    .badge-b { animation: badgeB 16s linear infinite; }
    @keyframes badgeA { 0%, 2% { opacity: 0; } 4%, 45% { opacity: 1; } 48%, 100% { opacity: 0; } }
    @keyframes badgeB { 0%, 49% { opacity: 0; } 52%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }

    .scene-a { animation: sceneA 16s linear infinite; }
    .scene-b { animation: sceneB 16s linear infinite; }
    @keyframes sceneA { 0%, 46% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes sceneB { 0%, 49% { opacity: 0; } 52%, 98% { opacity: 1; } 100% { opacity: 0; } }

    .type-a { animation: typeA 16s steps(32, end) infinite; }
    .type-b { animation: typeB 16s steps(21, end) infinite; }
    @keyframes typeA { 0%, 3% { width: 0; } 16%, 100% { width: 354px; } }
    @keyframes typeB { 0%, 52% { width: 0; } 65%, 100% { width: 236px; } }

    .caret { animation: caret 16s linear infinite; }
    @keyframes caret {
      0%, 1.5%, 3%, 50%, 51.5% { opacity: 1; }
      0.75%, 2.25%, 49%, 50.75%, 53%, 100% { opacity: 0; }
    }

    .out-a1 { animation: outA1 16s linear infinite; }
    .out-a2 { animation: outA2 16s linear infinite; }
    .out-b1 { animation: outB1 16s linear infinite; }
    .out-b2 { animation: outB2 16s linear infinite; }
    .out-b3 { animation: outB3 16s linear infinite; }
    @keyframes outA1 { 0%, 18% { opacity: 0; } 20%, 100% { opacity: 1; } }
    @keyframes outA2 { 0%, 21% { opacity: 0; } 23%, 100% { opacity: 1; } }
    @keyframes outB1 { 0%, 67% { opacity: 0; } 69%, 100% { opacity: 1; } }
    @keyframes outB2 { 0%, 70% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes outB3 { 0%, 73% { opacity: 0; } 75%, 100% { opacity: 1; } }

    .signal-line { stroke-dasharray: 260; animation: signalLine 16s linear infinite; }
    @keyframes signalLine {
      0%, 21% { stroke-dashoffset: 260; opacity: 0; }
      22% { opacity: 1; }
      29%, 44% { stroke-dashoffset: 0; opacity: 1; }
      48%, 73% { stroke-dashoffset: 260; opacity: 0; }
      74% { opacity: 1; }
      82%, 96% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .signal-dot { animation: signalDot 16s ease-in-out infinite; }
    @keyframes signalDot {
      0%, 21% { opacity: 0; transform: translate(0, 0); }
      22% { opacity: 1; }
      29% { opacity: 1; transform: translate(144px, -53px); }
      30%, 73% { opacity: 0; transform: translate(0, 0); }
      74% { opacity: 1; }
      82% { opacity: 1; transform: translate(144px, -53px); }
      83%, 100% { opacity: 0; transform: translate(144px, -53px); }
    }

    .notification { animation: notification 16s ease-in-out infinite; }
    @keyframes notification {
      0%, 29% { opacity: 0; transform: translateY(-94px); }
      32%, 41% { opacity: 1; transform: translateY(0); }
      46%, 82% { opacity: 0; transform: translateY(-94px); }
      85%, 94% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(-94px); }
    }

    .event-a { transform-box: fill-box; transform-origin: center; animation: eventA 16s ease-out infinite; }
    .event-b { transform-box: fill-box; transform-origin: center; animation: eventB 16s ease-out infinite; }
    @keyframes eventA {
      0%, 32% { opacity: 0; transform: translateY(18px) scale(0.96); }
      36%, 46% { opacity: 1; transform: translateY(0) scale(1); }
      49%, 100% { opacity: 0; transform: translateY(0) scale(1); }
    }
    @keyframes eventB {
      0%, 85% { opacity: 0; transform: translateY(18px) scale(0.96); }
      89%, 98% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .badge-a, .badge-b, .scene-a, .scene-b, .type-a, .type-b, .caret,
      .out-a1, .out-a2, .out-b1, .out-b2, .out-b3, .signal-line,
      .signal-dot, .notification, .event-a, .event-b { animation: none; }
      .badge-b, .scene-b, .signal-dot, .notification, .event-b { opacity: 0; }
      .type-a { width: 354px; }
      .out-a1, .out-a2, .event-a { opacity: 1; }
      .signal-line { opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <clipPath id="canvasClip"><rect width="1200" height="520" rx="32"/></clipPath>
    <clipPath id="phoneScreen"><rect x="886" y="29" width="278" height="462" rx="40"/></clipPath>
    <clipPath id="typeClipA"><rect class="type-a" x="84" y="159" width="354" height="28"/></clipPath>
    <clipPath id="typeClipB"><rect class="type-b" x="84" y="159" width="236" height="28"/></clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="520" fill="#eee8de"/>
    <circle cx="1128" cy="58" r="126" fill="#ff982a"/>
    <circle cx="807" cy="87" r="34" fill="#ff476f"/>
    <rect x="742" y="394" width="174" height="160" rx="86" fill="#08726c"/>
    <circle cx="829" cy="429" r="52" fill="#5635b8"/>

    <g class="badge-a">
      <rect x="32" y="28" width="350" height="40" rx="20" fill="#ff982a"/>
      <text class="ui" x="207" y="54" font-size="15" font-weight="750" fill="#17171d" text-anchor="middle">No install — send from any service</text>
    </g>
    <g class="badge-b">
      <rect x="32" y="28" width="320" height="40" rx="20" fill="#17171d"/>
      <text class="ui" x="192" y="54" font-size="15" font-weight="750" fill="#fbf7ef" text-anchor="middle">Or wrap a command with the CLI</text>
    </g>

    <g>
      <rect x="32" y="84" width="700" height="376" rx="24" fill="#17171d"/>
      <rect x="33" y="85" width="698" height="48" rx="23" fill="#202127"/>
      <rect x="33" y="111" width="698" height="22" fill="#202127"/>
      <circle cx="64" cy="108" r="7" fill="#ff5f57"/>
      <circle cx="88" cy="108" r="7" fill="#febc2e"/>
      <circle cx="112" cy="108" r="7" fill="#28c840"/>
      <text class="ui" x="382" y="113" font-size="12" fill="#8f93a2" text-anchor="middle">my-mac — zsh</text>

      <text class="mono" x="62" y="180" font-size="17" font-weight="700" fill="#7aa2f7">❯</text>
      <rect class="caret" x="84" y="162" width="10" height="21" fill="#e8eaf0"/>

      <g class="scene-a">
        <text class="mono" x="86" y="180" font-size="16" fill="#e8eaf0" clip-path="url(#typeClipA)">curl -X POST "$BBBBB_SOURCE_URL"</text>
        <text class="mono out-a1" x="62" y="226" font-size="16" fill="#53d28d">Accepted.</text>
        <text class="mono out-a2" x="62" y="265" font-size="15" fill="#ffae62">bbbbb · update delivered</text>
        <text class="ui" x="82" y="429" font-size="13" fill="#9396a3">HTTPS · encrypted before bbbbb stores it</text>
      </g>

      <g class="scene-b">
        <text class="mono" x="86" y="180" font-size="17" fill="#e8eaf0" clip-path="url(#typeClipB)">bbbbb run -- npm test</text>
        <text class="mono out-b1" x="62" y="226" font-size="16" fill="#e8eaf0">Tests: 214 passed, 214 total</text>
        <text class="mono out-b2" x="62" y="260" font-size="16" fill="#53d28d">✓ Done in 18.4s — exit 0</text>
        <text class="mono out-b3" x="62" y="302" font-size="15" fill="#ffae62">bbbbb · Activity update sent</text>
        <text class="ui" x="82" y="429" font-size="13" fill="#9396a3">Encrypted before it leaves this computer</text>
      </g>

      <line x1="62" y1="394" x2="702" y2="394" stroke="#2c2d35"/>
      <circle cx="67" cy="424" r="5" fill="#53d28d"/>
    </g>

    <path class="signal-line" d="M 732 286 C 783 286 808 234 876 233" fill="none" stroke="#ff982a" stroke-width="4" stroke-linecap="round"/>
    <circle class="signal-dot" cx="732" cy="286" r="8" fill="#ff982a"/>

    <g>
      <rect x="876" y="20" width="296" height="480" rx="50" fill="#08080a"/>
      <rect x="886" y="29" width="278" height="462" rx="40" fill="#0f0e13"/>
      <text class="ui" x="908" y="58" font-size="12" font-weight="700" fill="#f8f6fa">9:41</text>
      <rect x="980" y="39" width="86" height="23" rx="12" fill="#030304"/>
      <rect x="1122" y="44" width="22" height="10" rx="3" fill="none" stroke="#f8f6fa" stroke-width="2"/>
      <rect x="1125" y="47" width="16" height="4" rx="1.5" fill="#f8f6fa"/>

      <text class="ui" x="904" y="132" font-size="42" font-weight="850" letter-spacing="-1.5" fill="#f8f6fa">Activity</text>
      <g transform="translate(1124 112)" stroke="#f8f6fa" stroke-width="3" stroke-linecap="round">
        <circle r="12" fill="none"/>
        <circle r="4" fill="none"/>
        <path d="M0-19v5M0 14v5M-19 0h5M14 0h5M-13-13l4 4M9 9l4 4M13-13l-4 4M-9 9l-4 4"/>
      </g>
      <circle cx="908" cy="164" r="6" fill="#38d26f"/>
      <text class="ui" x="924" y="169" font-size="15" fill="#aaa5b3">Synced just now</text>
      <text class="ui" x="904" y="208" font-size="12" font-weight="750" letter-spacing="1.4" fill="#aaa5b3">TODAY</text>

      <g class="event-a">
        <rect x="900" y="224" width="248" height="112" rx="24" fill="#242129" stroke="#34313a"/>
        <rect x="914" y="248" width="62" height="62" rx="18" fill="#ff982a"/>
        <circle cx="938" cy="269" r="24" fill="#3478f6"/>
        <path d="M 950 248 h26 v62 h-26 a30 30 0 0 1 0-62" fill="#e8102c"/>
        <circle cx="965" cy="294" r="18" fill="#17171d"/>
        <path d="M957 294l6 6 11-14" fill="none" stroke="#a7df3f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="ui" x="988" y="268" font-size="17" font-weight="750" fill="#f8f6fa">Deploy site</text>
        <text class="ui" x="988" y="291" font-size="12" fill="#b3aebd">Succeeded · GitHub</text>
        <text class="ui" x="988" y="311" font-size="11.5" fill="#85808d">Just now</text>
      </g>

      <g class="event-b">
        <rect x="900" y="224" width="248" height="112" rx="24" fill="#242129" stroke="#34313a"/>
        <rect x="914" y="248" width="62" height="62" rx="18" fill="#5635b8"/>
        <path d="M914 287l31-39h31v62h-62z" fill="#8ed320"/>
        <path d="M914 310v-28l22 28z" fill="#ff982a"/>
        <circle cx="965" cy="294" r="18" fill="#17171d"/>
        <path d="M957 294l6 6 11-14" fill="none" stroke="#a7df3f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="ui" x="988" y="268" font-size="17" font-weight="750" fill="#f8f6fa">npm test</text>
        <text class="ui" x="988" y="291" font-size="12" fill="#b3aebd">Succeeded · My Mac</text>
        <text class="ui" x="988" y="311" font-size="11.5" fill="#85808d">Just now</text>
      </g>

      <g clip-path="url(#phoneScreen)">
        <g class="notification">
          <rect x="895" y="70" width="260" height="70" rx="20" fill="#2b2831" stroke="#3b3742"/>
          <rect x="908" y="83" width="44" height="44" rx="12" fill="#19181d"/>
          <text class="mono" x="930" y="111" font-size="18" font-weight="750" fill="#f8f6fa" text-anchor="middle">b</text>
          <text class="ui" x="965" y="98" font-size="13" font-weight="750" fill="#f8f6fa">bbbbb</text>
          <text class="ui" x="965" y="119" font-size="13" fill="#b3aebd">New activity.</text>
        </g>
      </g>

      <g>
        <path d="M 918 434 l 13 24 h-26 z" fill="#77727d"/>
        <circle cx="918" cy="452" r="2" fill="#0f0e13"/>
        <rect x="916.5" y="441" width="3" height="7" rx="1.5" fill="#0f0e13"/>
        <text class="ui" x="918" y="477" font-size="12" fill="#77727d" text-anchor="middle">Attention</text>
        <circle cx="1106" cy="447" r="13" fill="#a7df3f"/>
        <text class="ui" x="1106" y="477" font-size="12" font-weight="700" fill="#a7df3f" text-anchor="middle">Activity</text>
      </g>
      <rect x="974" y="486" width="100" height="4" rx="2" fill="#4a464f"/>
    </g>
  </g>
</svg>
