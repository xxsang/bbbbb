name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm run test:packaging
      - run: npm run check:cli-distributions
      - run: npm run check:public-core
